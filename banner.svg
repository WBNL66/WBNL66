<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="WBNL66 — 万般努力">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04060a"/>
      <stop offset="0.55" stop-color="#08111d"/>
      <stop offset="1" stop-color="#0a1a2c"/>
    </linearGradient>
    <linearGradient id="beamA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0c7fd0" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#7fd4ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0c7fd0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d5bff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a99bff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#6d5bff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0fa88f" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#67f0d2" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#0fa88f" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2ea6f0" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#2ea6f0" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-300%" width="160%" height="700%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <g stroke="#2b425f" stroke-width="1" opacity="0.16">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200"/>
    <path d="M120 0V300M360 0V300M600 0V300M840 0V300M1080 0V300"/>
  </g>

  <ellipse class="halo" cx="210" cy="150" rx="380" ry="180" fill="url(#halo)"/>

  <g filter="url(#soft)">
    <rect class="beam beamA" x="0" y="52" width="520" height="3" rx="1.5" fill="url(#beamA)"/>
    <rect class="beam beamB" x="0" y="150" width="640" height="2.5" rx="1.25" fill="url(#beamB)"/>
    <rect class="beam beamC" x="0" y="238" width="460" height="2" rx="1" fill="url(#beamC)"/>
  </g>

  <rect x="80" y="78" width="3" height="132" rx="1.5" fill="#2ea6f0" opacity="0.75"/>

  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',ui-sans-serif,system-ui,sans-serif">
    <text x="108" y="128" font-size="64" font-weight="700" fill="#f5f8fc" letter-spacing="2">万般努力</text>
    <text x="110" y="166" font-size="20" fill="#5aa9e6" letter-spacing="6" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">WBNL66</text>
    <text x="110" y="222" font-size="18.5" fill="#93a6bd" letter-spacing="0.6">创造真正有价值的东西。 ／ Building things that actually matter.</text>
    <text x="110" y="262" font-size="13" fill="#4d647f" letter-spacing="0.4" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">$ uptime --whoami → 保持折腾 · keep tinkering</text>
  </g>

  <style>
    @keyframes sweepA { 0% { transform: translateX(-560px); } 100% { transform: translateX(1260px); } }
    @keyframes sweepB { 0% { transform: translateX(-680px); } 100% { transform: translateX(1260px); } }
    @keyframes sweepC { 0% { transform: translateX(-500px); } 100% { transform: translateX(1260px); } }
    @keyframes breathe { 0%,100% { opacity: 0.55; } 50% { opacity: 0.95; } }
    .beamA { animation: sweepA 16s linear infinite; }
    .beamB { animation: sweepB 22s linear infinite; animation-delay: -6s; }
    .beamC { animation: sweepC 27s linear infinite; animation-delay: -13s; }
    .halo { animation: breathe 9s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .beamA, .beamB, .beamC, .halo { animation: none; }
    }
  </style>
</svg>
